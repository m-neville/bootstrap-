<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
</head>
<body>


<div class="container">
  <div class="row">
    <div class="col-sm-5 mx-auto">
        <form action="">
            <div class="mt-3 mb-3">
                <label for="first_name" class="form-label text-danger">first name</label>
                <input type="text" class="form-control rounded-0" id="first_name">
            </div>
        </form>
    </div>
</div>
  <div class="row">
    <div class="col-sm-5 mx-auto">
        <form action="">

            <div class="mt-3 mb-3">
                <label for="second_name" class="form-label text-danger">second name</label>
                <input type="text" class="form-control rounded-0" id="second_name">
            </div>
            <div class="mt-3 mb-3">
                <label for="email" class="form-label text-danger">email</label>
                <input type="email" class="form-control rounded-0" id="email">
            </div>
            <div class="mt-3 mb-3">
                <label for="password" class="form-label text-danger">password</label>
                <input type="text" class="form-control rounded-0" id="password">
            </div>
            <div class="mt-3 mb-3">
                <label for="username" class="form-label text-danger">username</label>
                <input type="text" class="form-control rounded-0" id="username">
            </div>
            <div class="mt-3 mb-3">
                <label for="edu" class="form-label text-danger">educational level</label>
                <select name="edu" id="edu" class="form-select">
                    <option value="1">University</option>
                    <option value="2">College</option>
                    <option value="3">Polytechnic</option>
                    <option value="">High school</option>
                    <option value="">Other</option>
                </select>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="radio1" name="Gender" >male
                <label class="form-check-label" for="radio1"></label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="radio2" name="Gender">female
                <label class="form-check-label" for="radio2"></label>
            </div>

            <button class="btn btn-dark mt-4">Register</button>


        </form>
    </div>
</div>

</div>

</body>
</html>
